cost:
  q_ranges:
  - - 0.5
    - 5.0
  - - 0.05
    - 1.0
  - - 5.0
    - 50.0
  - - 0.05
    - 2.0
  r_ranges:
  - - 0.01
    - 0.5
dataset:
  mixture:
    oracle_fraction: 0.1
    pd_fraction: 0.1
    random_fraction: 0.8
  num_trajectories: 20000
  oracle_action_noise_std: 0.05
  output_dir: artifacts/datasets/cartpole_H30
  pd:
    action_noise_std: 0.1
    kd_range:
    - 0.2
    - 2.5
    kp_range:
    - 0.5
    - 4.0
  random_open_loop:
    action_std: 5.0
    smoothing: 0.85
  split_fractions:
    test: 0.15
    train: 0.7
    val: 0.15
environment:
  dt: 0.05
  episode_len: 30
  force_limit: 0.0
  gravity: 9.81
  horizon: 30
  initial_state:
    angle:
    - -0.2
    - 0.2
    angular_velocity:
    - -0.5
    - 0.5
    position:
    - -1.0
    - 1.0
    velocity:
    - -0.5
    - 0.5
  length: 0.5
  m_c: 1.0
  m_p: 0.1
  system: cartpole
evaluation:
  m_plan: 5
  num_episodes: 100
  num_rollout_plots: 3
  output_dir: artifacts/eval/cartpole_tuned_logz_b3_H30
experiment:
  device: auto
  name: cartpole_logz_b3
  seed: 7
method:
  variant: cost_aware
model:
  eps_dim: 32
  hidden_dim: 256
  num_blocks: 4
reference:
  max_iters: 30
training:
  batch_size: 128
  beta_max: 3.0
  beta_ramp_fraction: 0.4
  context_temperature: 2.0
  cost_clip: 5.0
  cost_normalization: log_zscore
  grad_clip_norm: 1.0
  kernel: rbf
  kernel_temperatures:
  - 5.0
  lr: 0.0004
  max_epochs: 200
  negatives_m: 32
  output_dir: artifacts/runs/cartpole_tuned_logz_b3_H30
  patience: 10000000
  positives_k: 256
  validation_batches: 8
  weight_decay: 0.0001
