experiment:
  name: quadrotor_cost_aware
  seed: 7
  device: auto
method:
  variant: cost_aware
environment:
  system: quadrotor
  mass: 1.0
  inertia: 0.05
  arm: 0.25
  gravity: 9.81
  dt: 0.05
  horizon: 30
  episode_len: 30
  thrust_limit: 10.0
  state_clip: 10000.0
  initial_state:
    position_x:
    - -2.0
    - 2.0
    velocity_x:
    - -1.5
    - 1.5
    position_z:
    - -2.0
    - 2.0
    velocity_z:
    - -1.5
    - 1.5
    angle:
    - -0.5
    - 0.5
    angular_velocity:
    - -2.0
    - 2.0
reference:
  max_iters: 30
cost:
  q_ranges:
  - - 0.5
    - 5.0
  - - 0.05
    - 1.0
  - - 0.5
    - 5.0
  - - 0.05
    - 1.0
  - - 2.0
    - 20.0
  - - 0.05
    - 1.0
  r_ranges:
  - - 0.01
    - 0.5
  - - 0.01
    - 0.5
dataset:
  output_dir: artifacts/datasets/quadrotor_H30
  num_trajectories: 20000
  split_fractions:
    train: 0.7
    val: 0.15
    test: 0.15
  mixture:
    oracle_fraction: 0.1
    pd_fraction: 0.1
    random_fraction: 0.8
  oracle_action_noise_std: 0.1
  pd:
    kp_range:
    - 0.2
    - 1.5
    kd_range:
    - 0.3
    - 1.5
    action_noise_std: 0.2
  random_open_loop:
    action_std: 4.0
    smoothing: 0.85
model:
  eps_dim: 32
  hidden_dim: 256
  num_blocks: 4
training:
  output_dir: artifacts/runs/quadrotor_cost_aware_H30
  batch_size: 128
  positives_k: 256
  negatives_m: 32
  lr: 0.0004
  weight_decay: 0.0001
  beta_max: 1.0
  beta_ramp_fraction: 0.4
  max_epochs: 200
  patience: 10000000
  grad_clip_norm: 1.0
  validation_batches: 8
  context_temperature: 2.0
  kernel: rbf
  kernel_temperatures:
  - 5.0
  cost_normalization: zscore
  cost_clip: 5.0
evaluation:
  output_dir: artifacts/eval/quadrotor_cost_aware_H30
  num_episodes: 100
  m_plan: 5
  num_rollout_plots: 3
